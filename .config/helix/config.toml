# theme = "catppuccin_mocha"
theme = "jetbrains_dark"

[editor]
mouse = false
auto-save = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]

# hidden = false

# [keys.normal]
# C-s = ":w" # Maps Ctrl-s to the typable command :w which is an alias for :write (save file)

# [keys.insert]
# "C-space" = "completion"

# [keys.normal]
# "*" = ["move_prev_word_start", "move_next_word_end", "search_selection", "global_search"]

[keys.normal]
C-g = [
    ":write-all", 
    ":new", 
    ":insert-output lazygit", 
    ":buffer-close!", 
    ":redraw", 
    ":reload-all"
]
